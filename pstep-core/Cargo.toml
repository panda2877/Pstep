[package]
name = "pstep-core"
version = "0.2.0"
edition = "2024"

[dev-dependencies]
tempfile = "3"
mockito = "1"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
tracing = "0.1"
async-trait = "0.1"
dotenvy = "0.15"
thiserror = "2"
