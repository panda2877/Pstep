$:
  push:
    - name: build-and-test
      docker:
        image: rust:latest
      env:
        CARGO_TERM_COLOR: always
      stages:
        - name: setup-cargo-registry
          script: |
            # 用 CNB 制品库加速 cargo 依赖下载
            # 制品库: https://cnb.cool/panda2877/pstep-cargo
            mkdir -p ~/.cargo
            cat > ~/.cargo/config.toml << EOF
            [source.crates-io]
            replace-with = "cnb-cargo"

            [source.cnb-cargo]
            registry = "sparse+https://token:${CNB_TOKEN}@cnb.cool/api/packages/panda2877/pstep-cargo/cargo"
            EOF
        - name: install-system-deps
          script: |
            apt-get update
            apt-get install -y pkg-config libssl-dev
            rustup component add clippy rustfmt
        - name: build
          script: |
            cargo build --workspace
        - name: test
          script: |
            cargo test --workspace
        - name: clippy
          script: |
            cargo clippy --workspace -- -D warnings
          continue-on-error: true
        - name: fmt
          script: |
            cargo fmt --all --check
          continue-on-error: true

    - name: release-build
      docker:
        image: rust:latest
      env:
        CARGO_TERM_COLOR: always
      stages:
        - name: setup-cargo-registry
          script: |
            mkdir -p ~/.cargo
            cat > ~/.cargo/config.toml << EOF
            [source.crates-io]
            replace-with = "cnb-cargo"

            [source.cnb-cargo]
            registry = "sparse+https://token:${CNB_TOKEN}@cnb.cool/api/packages/panda2877/pstep-cargo/cargo"
            EOF
        - name: install-system-deps
          script: |
            apt-get update
            apt-get install -y pkg-config libssl-dev
            rustup component add clippy rustfmt
        - name: build-release
          script: |
            cargo build --release --workspace
        - name: publish-release
          script: |
            set -e
            VERSION=$(grep '^version' /workspace/pstep-gateway/Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
            TAG="v${VERSION}-build-${CNB_BUILD_SN}"
            BINARY="/workspace/target/release/pstep-gateway"
            API="${CNB_API_ENDPOINT:-https://api.cnb.cool}"
            REPO="panda2877/Pstep"

            echo "=== Publishing release ${TAG} ==="

            # 1. 创建 Release（用 printf 避免 YAML 特殊字符）
            RELEASE_JSON=$(printf '{"tag_name":"%s","name":"Pstep Gateway %s","body":"Build %s"}' \
              "${TAG}" "${TAG}" "${CNB_BUILD_SN}")
            RESP=$(curl -s -X POST "${API}/${REPO}/-/releases" \
              -H "Accept: application/vnd.cnb.api+json" \
              -H "Authorization: Bearer ${CNB_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "${RELEASE_JSON}")

            # 解析 release id（用 grep + sed，无 YAML 冲突）
            RELEASE_ID=$(echo "${RESP}" | grep -o '"id":"[^"]*"' | cut -d'"' -f4 | head -1)
            if [ -z "${RELEASE_ID}" ]; then
              echo "Release creation response: ${RESP}"
              echo "Tag may already exist, skipping..."
              exit 0
            fi
            echo "Release created: id=${RELEASE_ID}"

            # 2. 获取上传 URL
            UPLOAD_RESP=$(curl -s -X POST \
              "${API}/${REPO}/-/releases/${RELEASE_ID}/assets/upload-url" \
              -H "Accept: application/vnd.cnb.api+json" \
              -H "Authorization: Bearer ${CNB_TOKEN}" \
              -H "Content-Type: application/json" \
              -d '{"name":"pstep-gateway-x86_64-linux"}')

            UPLOAD_URL=$(echo "${UPLOAD_RESP}" | grep -o '"upload_url":"[^"]*"' | cut -d'"' -f4 | head -1)
            ASSET_ID=$(echo "${UPLOAD_RESP}" | grep -o '"id":"[^"]*"' | cut -d'"' -f4 | head -1)

            if [ -z "${UPLOAD_URL}" ]; then
              echo "Upload URL response: ${UPLOAD_RESP}"
              exit 1
            fi
            echo "Upload URL obtained"

            # 3. 上传二进制
            curl -s -X PUT "${UPLOAD_URL}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"${BINARY}"
            echo "Binary uploaded"

            # 4. 确认上传
            if [ -n "${ASSET_ID}" ]; then
              curl -s -X POST "${API}/${REPO}/-/releases/assets/${ASSET_ID}/upload-confirmation" \
                -H "Accept: application/vnd.cnb.api+json" \
                -H "Authorization: Bearer ${CNB_TOKEN}" > /dev/null
              echo "Upload confirmed"
            fi

            echo "=== Done: https://cnb.cool/${REPO}/-/releases/tags/${TAG} ==="

    - name: sync-to-github
      imports:
        - https://cnb.cool/panda2877/secrets/-/blob/main/github-sync.yml
      docker:
        image: alpine/git
      env:
        GITHUB_REMOTE: git@github.com:panda2877/Pstep.git
      stages:
        - name: setup-ssh
          script: |
            mkdir -p ~/.ssh
            echo "$GITHUB_SSH_KEY" > ~/.ssh/id_ed25519
            echo "$GITHUB_SSH_KEY_PUB" > ~/.ssh/id_ed25519.pub
            chmod 600 ~/.ssh/id_ed25519
            chmod 644 ~/.ssh/id_ed25519.pub
            cat > ~/.ssh/config << 'SSHEOF'
            Host github.com
                Hostname ssh.github.com
                Port 443
                User git
            SSHEOF
            chmod 600 ~/.ssh/config
            ssh-keyscan -p 443 ssh.github.com >> ~/.ssh/known_hosts 2>/dev/null
        - name: sync
          script: |
            git remote add github "$GITHUB_REMOTE" 2>/dev/null || true
            git push --force github "$CNB_BRANCH"
