$:
  push:
    - name: build-and-test
      docker:
        image: rust:latest
      env:
        CARGO_TERM_COLOR: always
      stages:
        - name: setup-cargo-registry
          script: |
            # 用 CNB 制品库加速 cargo 依赖下载
            # 制品库: https://cnb.cool/panda2877/pstep-cargo
            mkdir -p ~/.cargo
            cat > ~/.cargo/config.toml << EOF
            [source.crates-io]
            replace-with = "cnb-cargo"

            [source.cnb-cargo]
            registry = "sparse+https://token:${CNB_TOKEN}@cnb.cool/api/packages/panda2877/pstep-cargo/cargo"
            EOF
        - name: install-system-deps
          script: |
            apt-get update
            apt-get install -y pkg-config libssl-dev
        - name: build
          script: |
            cargo build --workspace
        - name: test
          script: |
            cargo test --workspace
        - name: clippy
          script: |
            cargo clippy --workspace -- -D warnings
          continue-on-error: true
        - name: fmt
          script: |
            cargo fmt --all --check
          continue-on-error: true

    - name: release-build
      docker:
        image: rust:latest
      env:
        CARGO_TERM_COLOR: always
      stages:
        - name: setup-cargo-registry
          script: |
            mkdir -p ~/.cargo
            cat > ~/.cargo/config.toml << EOF
            [source.crates-io]
            replace-with = "cnb-cargo"

            [source.cnb-cargo]
            registry = "sparse+https://token:${CNB_TOKEN}@cnb.cool/api/packages/panda2877/pstep-cargo/cargo"
            EOF
        - name: install-system-deps
          script: |
            apt-get update
            apt-get install -y pkg-config libssl-dev
        - name: build-release
          script: |
            cargo build --release --workspace

    - name: sync-to-github
      imports:
        - https://cnb.cool/panda2877/secrets/-/blob/main/github-sync.yml
      docker:
        image: alpine/git
      env:
        GITHUB_REMOTE: git@github.com:panda2877/Pstep.git
      stages:
        - name: setup-ssh
          script: |
            mkdir -p ~/.ssh
            echo "$GITHUB_SSH_KEY" > ~/.ssh/id_ed25519
            echo "$GITHUB_SSH_KEY_PUB" > ~/.ssh/id_ed25519.pub
            chmod 600 ~/.ssh/id_ed25519
            chmod 644 ~/.ssh/id_ed25519.pub
            cat > ~/.ssh/config << 'SSHEOF'
            Host github.com
                Hostname ssh.github.com
                Port 443
                User git
            SSHEOF
            chmod 600 ~/.ssh/config
            ssh-keyscan -p 443 ssh.github.com >> ~/.ssh/known_hosts 2>/dev/null
        - name: sync
          script: |
            git remote add github "$GITHUB_REMOTE" 2>/dev/null || true
            git push github "$CNB_BRANCH"
